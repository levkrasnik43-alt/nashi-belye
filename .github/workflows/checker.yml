name: Update 'Наши белые' VPN Subscription

on:
  schedule:
    # Запуск каждые 30 минут
    - cron: '*/30 * * * *'
  workflow_dispatch: # Ручной запуск в любое время
  push:
    branches:
      - main
    paths-ignore:
      - 'sub*.txt'
      - 'README.md'

permissions:
  contents: write

concurrency:
  group: vpn-checker
  cancel-in-progress: true

jobs:
  check-and-update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Xray-core
        run: |
          XRAY_VER="v25.1.30"
          curl -sL "https://github.com/XTLS/Xray-core/releases/download/${XRAY_VER}/Xray-linux-64.zip" -o xray.zip
          unzip -q xray.zip xray
          chmod +x xray
          sudo mv xray /usr/local/bin/xray
          rm -f xray.zip
          xray version

      - name: Run VPN Checker & Speed Benchmark
        run: |
          python checker.py

      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add sub*.txt README.md
          if git diff --staged --quiet; then
            echo "Нет изменений в списке серверов."
          else
            git commit -m "Автообновление подписки 'Наши белые' (ТОП скорости МТС) [skip ci]"
            git push
          fi
